[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agenda-robota-strips"
version = "1.0.0"
description = "Agenda Robota STRIPS: planificador y simulador interactivo STRIPS 4x4 con FastAPI y BFS."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.128,<1.0",
    "uvicorn[standard]>=0.48,<1.0",
    "pydantic>=2.13,<3.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
    "httpx>=0.28,<1.0"
]

[project.scripts]
agenda-robota-strips-demo = "agenda_robota_strips.demo:main"
agenda-robota-strips-web = "agenda_robota_strips.main:run"

[tool.setuptools.package-data]
agenda_robota_strips = ["web/*.html", "web/static/*.css", "web/static/*.js", "web/static/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
